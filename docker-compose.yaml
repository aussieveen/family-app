version: '3.7'

services:
  app:
    image: family-app:local
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile.dev
    environment:
      OPCACHE_VALIDATE_TIMESTAMPS: 1
      ENV: dev
    volumes:
      - ./app:/var/www/html:rw,cached
  nginx:
    container_name: family-app-nginx
    image: nginx:stable-alpine
    ports:
      - '${APP_PORT}:80'
    volumes:
      - ./app/public:/var/www/html/public
      - ./docker/nginx/conf.d/default.dev.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
  database:
    container_name: family-app-db
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: familyapp
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: api
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql:rw
  frontend:
    container_name: family-app-frontend
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - '${FRONTEND_PORT:-3000}:5173'
    volumes:
      - ./frontend:/app:rw,cached
    environment:
      - VITE_FAMILY_API_URL=http://localhost:${APP_PORT:-10002}
      - VITE_MEAL_API_URL=http://localhost:10001
      - VITE_COOKBOOK_API_URL=http://localhost:10000
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  db_data: {}

